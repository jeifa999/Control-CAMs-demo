<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Cams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #111827; color: #f3f4f6; font-family: sans-serif; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- ================= VISTA: LOGIN ================= -->
  <div id="view-login" class="min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6 text-center text-purple-500">Control de Cams</h2>
      <input id="login-user" type="text" placeholder="Usuario" class="w-full p-3 mb-4 bg-gray-700 rounded outline-none text-white">
      <input id="login-pass" type="password" placeholder="Contraseña" class="w-full p-3 mb-6 bg-gray-700 rounded outline-none text-white">
      <button onclick="window.login()" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded font-bold">Iniciar Sesión</button>
    </div>
  </div>

  <!-- ================= VISTA: ADMIN ================= -->
  <div id="view-admin" class="hidden">
    <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
      <h1 class="text-xl font-bold text-purple-400">Panel Admin</h1>
      <button onclick="window.logout()" class="bg-red-600 px-3 py-1 rounded text-sm font-bold">Salir</button>
    </div>

    <div class="bg-gray-800 p-4 rounded-lg mb-6">
      <h3 class="font-bold mb-3">Agregar Modelo</h3>
      <input id="new-name" type="text" placeholder="Nombre real" class="w-full p-2 mb-2 bg-gray-700 rounded text-sm">
      <input id="new-user" type="text" placeholder="Usuario" class="w-full p-2 mb-2 bg-gray-700 rounded text-sm">
      <input id="new-pass" type="text" placeholder="Contraseña" class="w-full p-2 mb-2 bg-gray-700 rounded text-sm">
      <input id="new-hours" type="number" placeholder="Horas (Ej: 6)" class="w-full p-2 mb-3 bg-gray-700 rounded text-sm">
      <button onclick="window.addModel()" class="w-full bg-green-600 p-2 rounded font-bold text-sm">Crear Modelo</button>
    </div>

    <h3 class="font-bold mb-3">Lista de Modelos</h3>
    <div id="admin-models-list" class="space-y-4"></div>
  </div>

  <!-- ================= VISTA: MODELO ================= -->
  <div id="view-model" class="hidden max-w-md mx-auto">
    <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
      <h1 id="model-greeting" class="text-xl font-bold text-purple-400">Estudio</h1>
      <button onclick="window.logout()" class="bg-red-600 px-3 py-1 rounded text-sm font-bold">Salir</button>
    </div>

    <div class="bg-gray-800 p-6 rounded-xl text-center shadow-lg mb-6">
      <h2 id="timer-display" class="text-5xl font-mono mb-4 text-purple-400">00:00:00</h2>
      <div class="w-full bg-gray-700 rounded-full h-3 mb-2">
        <div id="progress-bar" class="bg-purple-500 h-3 rounded-full transition-all duration-1000" style="width: 0%"></div>
      </div>
      <p id="goal-display" class="mb-6 text-gray-400 text-sm">Meta: 0 horas</p>
      
      <button id="btn-stream" onclick="window.toggleStream()" class="w-full py-4 text-lg font-bold rounded-lg transition bg-green-600">
        ▶ Iniciar Transmisión
      </button>
    </div>

    <div id="alerts-container" class="space-y-3"></div>
  </div>

  <!-- ================= LÓGICA DE LA APP (FIREBASE + JS) ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración proporcionada
    const firebaseConfig = {
      apiKey: "AIzaSyCdN8yquy8ocWm6h2R0oVcwaihDQipRtcg",
      authDomain: "control-de-cams.firebaseapp.com",
      databaseURL: "https://control-de-cams-default-rtdb.firebaseio.com",
      projectId: "control-de-cams",
      storageBucket: "control-de-cams.firebasestorage.app",
      messagingSenderId: "507376116899",
      appId: "1:507376116899:web:1f61288c225ef935e48b16",
      measurementId: "G-MEMXE34CED"
    };

    // Inicializar Firebase
    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) {
      alert("Error al inicializar Firebase: " + e.message);
    }

    // Estado global
    let currentUser = null;
    let modelsData = [];
    let timerInterval = null;

    // Escuchar base de datos en tiempo real (con la corrección del tiempo local)
    if(db) {
      onSnapshot(collection(db, 'models'), (snapshot) => {
        modelsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        if (currentUser && currentUser.role === 'model') {
          const updated = modelsData.find(m => m.id === currentUser.id);
          if (updated) {
            const segundosEnPantalla = currentUser.workedSeconds;
            currentUser = { role: 'model', ...updated };
            
            // Si está transmitiendo, respetamos el tiempo local de su pantalla para que no parpadee a 0
            if (currentUser.isStreaming) {
              currentUser.workedSeconds = segundosEnPantalla;
            }
            updateModelUI();
          }
        }
        
        if (currentUser && currentUser.role === 'admin') {
          renderAdminList();
        }
      });
    }

    // --- FUNCIONES GLOBALES ---
    window.login = () => {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;

      if (u === 'admin' && p === 'admin') {
        currentUser = { role: 'admin' };
        showView('view-admin');
        renderAdminList();
      } else {
        const model = modelsData.find(m => m.username === u && m.password === p);
        if (model) {
          currentUser = { role: 'model', ...model };
          showView('view-model');
          updateModelUI();
          startLocalTimerIfNeeded();
        } else {
          alert('Usuario o contraseña incorrectos');
        }
      }
    };

    window.logout = () => {
      currentUser = null;
      clearInterval(timerInterval);
      document.getElementById('login-user').value = '';
      document.getElementById('login-pass').value = '';
      showView('view-login');
    };

    // --- LÓGICA DE ADMIN (con corrección de try/catch) ---
    window.addModel = async () => {
      try {
        if (!db) return alert("Firebase no está conectado.");

        const name = document.getElementById('new-name').value;
        const user = document.getElementById('new-user').value;
        const pass = document.getElementById('new-pass').value;
        const hours = document.getElementById('new-hours').value;
        
        if(!name || !user || !pass || !hours) {
          return alert('Por favor, llena todos los campos primero.');
        }

        await addDoc(collection(db, 'models'), {
          name, username: user, password: pass, hoursGoal: Number(hours),
          workedSeconds: 0, isStreaming: false, warnings: '', punishments: ''
        });
        
        alert("¡Modelo agregada con éxito!");
        
        document.getElementById('new-name').value = '';
        document.getElementById('new-user').value = '';
        document.getElementById('new-pass').value = '';
        document.getElementById('new-hours').value = '';
      } catch (error) {
        alert("Error de Firebase: " + error.message);
      }
    };

    window.deleteModel = async (id) => {
      if(confirm('¿Seguro que deseas eliminar esta modelo?')) {
        await deleteDoc(doc(db, 'models', id));
      }
    };

    window.updateField = async (id, field, value) => {
      await updateDoc(doc(db, 'models', id), { [field]: value });
    };

    function renderAdminList() {
      const container = document.getElementById('admin-models-list');
      container.innerHTML = '';
      modelsData.forEach(m => {
        const hours = (m.workedSeconds / 3600).toFixed(2);
        const status = m.isStreaming ? '<span class="text-green-400 font-bold">🔴 En vivo</span>' : '<span class="text-gray-400">Inactiva</span>';
        container.innerHTML += `
          <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-purple-500">
            <div class="flex justify-between items-start mb-2">
              <h4 class="font-bold">${m.name} <span class="text-xs text-gray-400">(@${m.username})</span></h4>
              <button onclick="window.deleteModel('${m.id}')" class="text-red-500 font-bold text-xl">×</button>
            </div>
            <p class="text-sm mb-1">${status} | Tiempo: ${hours}h / ${m.hoursGoal}h</p>
            <input type="text" placeholder="Añadir Advertencia..." value="${m.warnings}" onchange="window.updateField('${m.id}', 'warnings', this.value)" class="w-full p-2 mt-2 bg-gray-700 rounded text-sm text-yellow-300">
            <input type="text" placeholder="Añadir Sanción/Castigo..." value="${m.punishments}" onchange="window.updateField('${m.id}', 'punishments', this.value)" class="w-full p-2 mt-2 bg-gray-700 rounded text-sm text-red-300">
          </div>
        `;
      });
    }

    // --- LÓGICA DE MODELO (con corrección al detener) ---
    window.toggleStream = async () => {
      const newState = !currentUser.isStreaming;
      
      // Al pausar o iniciar, forzamos el guardado del tiempo exacto
      await updateDoc(doc(db, 'models', currentUser.id), { 
        isStreaming: newState,
        workedSeconds: currentUser.workedSeconds
      });
    };

    function startLocalTimerIfNeeded() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (currentUser && currentUser.isStreaming) {
          currentUser.workedSeconds += 1;
          updateTimerDisplay();
          
          // Respaldo automático en la nube cada 60 segundos
          if (currentUser.workedSeconds % 60 === 0) {
            updateDoc(doc(db, 'models', currentUser.id), { workedSeconds: currentUser.workedSeconds });
          }
        }
      }, 1000);
    }

    function updateModelUI() {
      document.getElementById('model-greeting').innerText = `Hola, ${currentUser.name}`;
      document.getElementById('goal-display').innerText = `Meta diaria: ${currentUser.hoursGoal} horas`;
      
      const btn = document.getElementById('btn-stream');
      if (currentUser.isStreaming) {
        btn.innerHTML = '⏹ Detener Transmisión';
        btn.classList.replace('bg-green-600', 'bg-red-600');
        btn.classList.add('animate-pulse');
      } else {
        btn.innerHTML = '▶ Iniciar Transmisión';
        btn.classList.replace('bg-red-600', 'bg-green-600');
        btn.classList.remove('animate-pulse');
      }

      const alerts = document.getElementById('alerts-container');
      alerts.innerHTML = '';
      if(currentUser.warnings) alerts.innerHTML += `<div class="bg-yellow-900/80 p-3 rounded text-yellow-200 text-sm"><b>⚠ Advertencia:</b> ${currentUser.warnings}</div>`;
      if(currentUser.punishments) alerts.innerHTML += `<div class="bg-red-900/80 p-3 rounded text-red-200 text-sm"><b>⛔ Sanción:</b> ${currentUser.punishments}</div>`;

      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      if(!currentUser) return;
      const s = currentUser.workedSeconds;
      const h = Math.floor(s / 3600).toString().padStart(2, '0');
      const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${h}:${m}:${sec}`;

      const progress = Math.min((s / (currentUser.hoursGoal * 3600)) * 100, 100);
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    // --- UTILIDADES ---
    function showView(viewId) {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById('view-model').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
    }
  </script>
</body>
</html>
